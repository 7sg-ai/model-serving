# Workload Definition File (WDF) — corrected for nim-ide-assistant
# apiVersion wdf.7sg.ai/v2 (scenario-based). Validated against
# services/artifacts/schema/wdf.schema.202605011755.json.
#
# NOTES / placeholders to review before use:
#  - This app has no per-app Dockerfile. The gcp-gpu-vm scenario builds
#    Flask from repo root + deploy/Dockerfile.python (so shared/ is
#    included). Native local remains a client to an already-running NIM.
#  - autoscaling is pinned to 1 replica: all apps share a local SQLite store
#    (shared/database/*.db), which is not safe to run multi-replica as-is.
#  - This app is an OpenAI-compatible IDE API (Cline/Cursor). On gcp-gpu-vm
#    Sherpa deploys NVIDIA NIM first, verifies /v1/models, then starts ide-api.
#    Do not run a second GPU NIM alongside hf-streamlit-chat (TDF maxGPUs: 1).
#  - AUTO_DEPLOY_MODEL must stay false so ide-api does not docker-run another NIM.
#  - API_KEY (secret ide-api-key) authenticates IDE clients. NGC_API_KEY
#    (secret ngc-api-key) pulls/serves Qwen2.5-Coder weights for nim-server.
#  - API_KEY (secret ide-api-key) authenticates IDE clients. Value lives in
#    the org Vault under this exact name.
#  - The gcp-gpu-vm scenario is an alternate (v2 schema allows only
#    scenarios.native + scenarios.alternates[]). It targets TDF
#    `model-serving-gpu-vm-gcp-us-central` via deployments[].target.tdfRef.
#    NOTE: on this A100 VM the NVIDIA driver must be the proprietary
#    610.57.04 branch (the open 615 kernel module hangs on CUDA compute).
apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: nim-ide-assistant
  version: 1.2.1
  description: NIM-backed OpenAI-compatible API for IDE coding assistants (Cline/Cursor). GPU VM scenario deploys NIM then ide-api.
  tags:
    env: dev
source:
  repo: https://github.com/7sg-ai/model-serving
  branch: main
  path: nim-ide-assistant
security:
  policies:
    secretsInEnvAllowed: true
secrets:
  provider: sherpa-vault
  secretRefs:
    # IDE client auth (Cline/Cursor). Injected into ide-api as API_KEY.
    - name: ide-api-key
      injectAs: env
      envVar: API_KEY
      source_type: internal_value
      internalRef: ide-api-key
    # NIM model server needs an NGC API key to download/serve Qwen2.5-Coder weights.
    - name: ngc-api-key
      injectAs: env
      envVar: NGC_API_KEY
      source_type: internal_value
      internalRef: ngc-api-key
scenarios:
  native:
    description: Local single-node container host (matches the repo's local-first setup).
    topology:
      components:
      - name: ide-api
        role: api
        runtime:
          platform: container-platform
          regions:
          - local
          image:
            repository: model-serving/nim-ide-assistant
            tag: latest
          resources:
            cpu: '1'
            memory: 1Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: NIM_API_URL
            value: http://nim-llama:8000/v1/chat/completions
          - name: NIM_MODEL_NAME
            value: qwen/qwen2.5-coder-32b-instruct
          - name: AUTO_DEPLOY_MODEL
            value: 'false'
          - name: MAX_TOKENS
            value: '32768'
          - name: TEMPERATURE
            value: '0.3'
          - name: CONTEXT_WINDOW
            value: '1048576'
          envFromSecretRefs:
          - ide-api-key
        endpoints:
        - name: http
          port: 8080
          exposure: public
          protocol: http
          path: /v1
    deployments:
    - name: local
      target:
        provider: onprem
        region: local
        namespace: model-serving
      components:
      - ide-api
  alternates:
  # CPU-light Flask IDE API plus GPU NIM on the same VM. Sherpa apply
  # starts nim-server first, then ide-api. Dual-deploy with
  # hf-streamlit-chat is not supported (one GPU).
  - name: gcp-gpu-vm
    description: Pre-provisioned GCP GPU VM. NIM first, then ide-api on :8080.
    evaluation:
      judge:
        prompt_version: gpu-synthetic-goldens.v1
        prompt: >
          Score structure and intent, not string equality. Goldens are synthetic
          multi-turn coding templates (plan, implement, tests, review notes), not
          verbatim answers. Judge the assistant's last reply against the last user
          turn: it PASSES when it addresses that turn's intent (plan, code, tests,
          or review) with plausible structure. Extra correct detail is fine. Fail
          only on empty/refusal answers or a clearly unrelated topic.
      sla:
        semantic_quality_min: 0.6
        accepted_answer_rate_min_pct: 60
      gate_enabled: false
    topology:
      components:
      - name: nim-server
        role: custom
        runtime:
          platform: vm
          regions:
          - us-central1
          image:
            repository: nvcr.io/nim/qwen/qwen2.5-coder-32b-instruct
            tag: latest
          resources:
            cpu: '4'
            memory: 32Gi
            gpu:
              count: 1
              type: nvidia-a100-40gb
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: NIM_MODEL_NAME
            value: qwen/qwen2.5-coder-32b-instruct
          envFromSecretRefs:
          - ngc-api-key
        endpoints:
        - name: http
          port: 8000
          exposure: internal
          protocol: http
          path: /v1
      - name: ide-api
        role: api
        runtime:
          platform: vm
          regions:
          - us-central1
          image:
            repository: model-serving/nim-ide-assistant
            tag: latest
            context: .
            dockerfile: deploy/Dockerfile.python
          resources:
            cpu: '2'
            memory: 4Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: NIM_API_URL
            value: http://nim-server:8000/v1/chat/completions
          - name: BACKEND_URLS
            value: http://nim-server:8000/v1/chat/completions
          - name: BACKEND_STRATEGY
            value: round_robin
          - name: NIM_MODEL_NAME
            value: qwen/qwen2.5-coder-32b-instruct
          - name: LOAD_MODEL_WEIGHTS
            value: 'false'
          - name: AUTO_DEPLOY_MODEL
            value: 'false'
          - name: HOST
            value: 0.0.0.0
          - name: PORT
            value: '8080'
          - name: MAX_TOKENS
            value: '32768'
          - name: TEMPERATURE
            value: '0.3'
          - name: CONTEXT_WINDOW
            value: '1048576'
          envFromSecretRefs:
          - ide-api-key
        endpoints:
        - name: http
          port: 8080
          exposure: public
          protocol: http
          path: /v1
    deployments:
    - name: gcp-us-central
      target:
        provider: gcp
        region: us-central1
        namespace: model-serving
        tdfRef: model-serving-gpu-vm-gcp-us-central
        cloudCredentialRef: gcp
      components:
      - nim-server
      - ide-api
  - name: azure-kubernetes
    description: Scale-out on an AKS GPU node pool.
    topology:
      components:
      - name: ide-api
        role: api
        runtime:
          platform: kubernetes
          regions:
          - eastus2
          image:
            repository: model-serving/nim-ide-assistant
            tag: latest
          resources:
            cpu: '1'
            memory: 1Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: NIM_API_URL
            value: http://nim-llama:8000/v1/chat/completions
          - name: NIM_MODEL_NAME
            value: qwen/qwen2.5-coder-32b-instruct
          - name: AUTO_DEPLOY_MODEL
            value: 'false'
          - name: MAX_TOKENS
            value: '32768'
          - name: TEMPERATURE
            value: '0.3'
          - name: CONTEXT_WINDOW
            value: '1048576'
          envFromSecretRefs:
          - ide-api-key
        endpoints:
        - name: http
          port: 8080
          exposure: public
          protocol: http
          path: /v1
    deployments:
    - name: azure-east
      target:
        provider: azure
        region: eastus2
        namespace: nim-ide-assistant
      components:
      - ide-api
