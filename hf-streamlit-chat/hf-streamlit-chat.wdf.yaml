# Workload Definition File (WDF) — corrected for hf-streamlit-chat
# apiVersion wdf.7sg.ai/v2 (scenario-based). Validated against
# services/artifacts/schema/wdf.schema.202605011755.json.
#
# NOTES / placeholders to review before use:
#  - This app has no per-app Dockerfile. The gcp-gpu-vm scenario builds
#    Streamlit from repo root + deploy/Dockerfile.python (so shared/ is
#    included). Native local remains generate-and-build / vLLM HF id.
#  - autoscaling is pinned to 1 replica: all apps share a local SQLite store
#    (shared/database/*.db), which is not safe to run multi-replica as-is.
#  - HF apps are OpenAI-compatible clients (no in-process Transformers). The model
#    server is a SEPARATE component. The gcp-gpu-vm scenario uses
#    NVIDIA NIM (nvcr.io/nim/meta/llama-3.1-8b-instruct) as the model
#    server; the chat-ui proxies to it via BACKEND_URLS. The common model
#    across all model-serving apps is meta-llama/Llama-3.1-8B-Instruct
#    (vLLM id) = meta/llama-3.1-8b-instruct (NIM catalog id).
#  - NIM needs NGC_API_KEY (secret ngc-api-key); vLLM would need HUGGING_FACE_HUB_TOKEN
#    (secret hf-hub-token). Both are declared below; only the one
#    matching the chosen model server is injected per scenario.
#  - The gcp-gpu-vm scenario is an alternate (v2 schema allows only
#    scenarios.native + scenarios.alternates[]). It targets TDF
#    `model-serving-gpu-vm-gcp-us-central` via deployments[].target.tdfRef.
#    NOTE: on this A100 VM the NVIDIA driver must be the proprietary
#    610.57.04 branch (the open 615 kernel module hangs on CUDA compute).
apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: hf-streamlit-chat
  version: 1.1.4
  description: HuggingFace Streamlit chat UI. OpenAI-compatible client to a model server (NIM on GCP GPU VM, vLLM locally).
  tags:
    env: dev
source:
  repo: https://github.com/7sg-ai/model-serving
  branch: main
  path: hf-streamlit-chat
security:
  policies:
    secretsInEnvAllowed: true
secrets:
  provider: sherpa-vault
  secretRefs:
    # NIM model server needs an NGC API key to download/serve the Llama
    # weights from the NGC catalog. Injected into the nim-server
    # component only. Value lives in the org Vault under this
    # exact name (same pattern as TDF SSH/GCP refs).
    - name: ngc-api-key
      injectAs: env
      envVar: NGC_API_KEY
      source_type: internal_value
      internalRef: ngc-api-key
    # vLLM path needs a HuggingFace hub token to pull gated Llama
    # weights. Used by the native (local) scenario. Value lives in
    # the org Vault under this exact name.
    - name: hf-hub-token
      injectAs: env
      envVar: HUGGING_FACE_HUB_TOKEN
      source_type: internal_value
      internalRef: hf-hub-token
scenarios:
  native:
    description: Local single-node container host (matches the repo's local-first setup).
    topology:
      components:
      - name: chat-ui
        role: ui
        runtime:
          platform: container-platform
          regions:
          - local
          image:
            repository: model-serving/hf-streamlit-chat
            tag: latest
          resources:
            cpu: '4'
            memory: 16Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: HF_MODEL_NAME
            value: meta-llama/Llama-3.1-8B-Instruct
        endpoints:
        - name: http
          port: 8501
          exposure: public
          protocol: http
          path: /
    deployments:
    - name: local
      target:
        provider: onprem
        region: local
        namespace: model-serving
      components:
      - chat-ui
  alternates:
  # Two components share one host: the CPU-light Streamlit UI and the GPU
  # vLLM model server. deploy_app_deployer is expected to run
  # `docker compose up -d` over SSH after immutable approval.
  - name: gcp-gpu-vm
    description: Pre-provisioned GCP GPU VM (Docker + NVIDIA Container Toolkit) in us-central1.
    topology:
      components:
      - name: chat-ui
        role: ui
        runtime:
          platform: vm
          regions:
          - us-central1
          image:
            repository: model-serving/hf-streamlit-chat
            tag: latest
            context: .
            dockerfile: deploy/Dockerfile.python
          resources:
            cpu: '2'
            memory: 4Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: HF_MODEL_NAME
            value: meta/llama-3.1-8b-instruct
          - name: NIM_MODEL_NAME
            value: meta/llama-3.1-8b-instruct
          - name: LOAD_MODEL_WEIGHTS
            value: 'false'
          - name: AUTO_DEPLOY_MODEL
            value: 'false'
          - name: BACKEND_URLS
            value: http://nim-server:8000/v1/chat/completions
          - name: BACKEND_STRATEGY
            value: round_robin
        endpoints:
        - name: http
          port: 8501
          exposure: public
          protocol: http
          path: /
      - name: nim-server
        role: custom
        runtime:
          platform: vm
          regions:
          - us-central1
          image:
            repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
            tag: latest
          resources:
            cpu: '4'
            memory: 32Gi
            gpu:
              count: 1
              type: nvidia-a100-40gb
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: NIM_MODEL_NAME
            value: meta/llama-3.1-8b-instruct
          envFromSecretRefs:
          - ngc-api-key
        endpoints:
        - name: http
          port: 8000
          exposure: internal
          protocol: http
          path: /v1
    deployments:
    - name: gcp-us-central
      target:
        provider: gcp
        region: us-central1
        namespace: model-serving
        tdfRef: model-serving-gpu-vm-gcp-us-central
        cloudCredentialRef: gcp
      components:
      - chat-ui
      - nim-server
  - name: azure-kubernetes
    description: Scale-out on an AKS GPU node pool.
    topology:
      components:
      - name: chat-ui
        role: ui
        runtime:
          platform: kubernetes
          regions:
          - eastus2
          image:
            repository: model-serving/hf-streamlit-chat
            tag: latest
          resources:
            cpu: '4'
            memory: 16Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: HF_MODEL_NAME
            value: meta-llama/Llama-3.1-8B-Instruct
        endpoints:
        - name: http
          port: 8501
          exposure: public
          protocol: http
          path: /
    deployments:
    - name: azure-east
      target:
        provider: azure
        region: eastus2
        namespace: hf-streamlit-chat
      components:
      - chat-ui
