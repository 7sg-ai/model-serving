# Workload Definition File (WDF) — corrected for hf-streamlit-chat
# apiVersion wdf.7sg.ai/v2 (scenario-based). Validated against
# services/artifacts/schema/wdf.schema.202605011755.json.
#
# NOTES / placeholders to review before use:
#  - This app has no Dockerfile; the platform build step (deploy_build_planner)
#    will GENERATE one (slim Python + pip + `streamlit run app.py`, non-root).
#  - autoscaling is pinned to 1 replica: all apps share a local SQLite store
#    (shared/database/*.db), which is not safe to run multi-replica as-is.
#  - HF apps are vLLM-only clients (no in-process Transformers). The model
#    server is a SEPARATE component (vllm-server) that the chat-ui proxies to
#    via BACKEND_URLS. The common model across all model-serving apps is
#    meta-llama/Llama-3.1-8B-Instruct (vLLM id) = meta/llama-3.1-8b-instruct (NIM).
#  - The gcp-gpu-vm scenario is an alternate (v2 schema allows only
#    scenarios.native + scenarios.alternates[]). It targets TDF
#    `model-serving-gpu-vm-gcp-us-central` via deployments[].target.tdfRef.
apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: hf-streamlit-chat
  version: 1.1.2
  description: HuggingFace Streamlit chat UI. OpenAI-compatible client to vLLM (no in-process Transformers).
  tags:
    env: dev
source:
  repo: https://github.com/7sg-ai/model-serving
  branch: main
  path: hf-streamlit-chat
security:
  policies:
    secretsInEnvAllowed: true
secrets:
  provider: sherpa-vault
  secretRefs:
    # Needed to pull gated Llama-3.1 weights from HuggingFace into the vLLM
    # container. Injected into the vllm-server component only. Value lives in
    # the org Vault under this exact name (same pattern as TDF SSH/GCP refs).
    - name: hf-hub-token
      injectAs: env
      envVar: HUGGING_FACE_HUB_TOKEN
      source_type: internal_value
      internalRef: hf-hub-token
scenarios:
  native:
    description: Local single-node container host (matches the repo's local-first setup).
    topology:
      components:
      - name: chat-ui
        role: ui
        runtime:
          platform: container-platform
          regions:
          - local
          image:
            repository: model-serving/hf-streamlit-chat
            tag: latest
          resources:
            cpu: '4'
            memory: 16Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: HF_MODEL_NAME
            value: meta-llama/Llama-3.1-8B-Instruct
        endpoints:
        - name: http
          port: 8501
          exposure: public
          protocol: http
          path: /
    deployments:
    - name: local
      target:
        provider: onprem
        region: local
        namespace: model-serving
      components:
      - chat-ui
  alternates:
  # Two components share one host: the CPU-light Streamlit UI and the GPU
  # vLLM model server. deploy_app_deployer is expected to run
  # `docker compose up -d` over SSH after immutable approval.
  - name: gcp-gpu-vm
    description: Pre-provisioned GCP GPU VM (Docker + NVIDIA Container Toolkit) in us-central1.
    topology:
      components:
      - name: chat-ui
        role: ui
        runtime:
          platform: vm
          regions:
          - us-central1
          image:
            repository: model-serving/hf-streamlit-chat
            tag: latest
          resources:
            cpu: '2'
            memory: 4Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: HF_MODEL_NAME
            value: meta-llama/Llama-3.1-8B-Instruct
          - name: BACKEND_URLS
            value: http://vllm-server:8000/v1/chat/completions
          - name: BACKEND_STRATEGY
            value: round_robin
        endpoints:
        - name: http
          port: 8501
          exposure: public
          protocol: http
          path: /
      - name: vllm-server
        role: custom
        runtime:
          platform: vm
          regions:
          - us-central1
          image:
            repository: vllm/vllm-openai
            tag: latest
          resources:
            cpu: '4'
            memory: 32Gi
            gpu:
              count: 1
              type: nvidia-a100-40gb
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: VLLM_MODEL
            value: meta-llama/Llama-3.1-8B-Instruct
          - name: TENSOR_PARALLEL_SIZE
            value: '1'
          - name: VLLM_MAX_MODEL_LEN
            value: '8192'
          envFromSecretRefs:
          - hf-hub-token
        endpoints:
        - name: http
          port: 8000
          exposure: internal
          protocol: http
          path: /v1
    deployments:
    - name: gcp-us-central
      target:
        provider: gcp
        region: us-central1
        namespace: model-serving
        tdfRef: model-serving-gpu-vm-gcp-us-central
        cloudCredentialRef: gcp
      components:
      - chat-ui
      - vllm-server
  - name: azure-kubernetes
    description: Scale-out on an AKS GPU node pool.
    topology:
      components:
      - name: chat-ui
        role: ui
        runtime:
          platform: kubernetes
          regions:
          - eastus2
          image:
            repository: model-serving/hf-streamlit-chat
            tag: latest
          resources:
            cpu: '4'
            memory: 16Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
            policy:
              metric: cpu
              target: 70
          env:
          - name: HF_MODEL_NAME
            value: meta-llama/Llama-3.1-8B-Instruct
        endpoints:
        - name: http
          port: 8501
          exposure: public
          protocol: http
          path: /
    deployments:
    - name: azure-east
      target:
        provider: azure
        region: eastus2
        namespace: hf-streamlit-chat
      components:
      - chat-ui
